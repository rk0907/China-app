<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — China Source GH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FBF6EE',
            forest: '#1A3A2A',
            orange: '#F07A3A',
            orangsoft: '#F5A06A',
            softpink: '#F7C9D4',
            softyellow: '#F5E6A3',
            softgreen: '#D4E8D8'
          },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] },
          borderRadius: { '4xl': '2rem' }
        }
      }
    }
  </script>
  <style>body { font-family: 'DM Sans', system-ui, sans-serif; }</style>
</head>
<body class="bg-cream text-forest antialiased pb-24">

  <header class="sticky top-0 z-40 bg-cream/95 backdrop-blur border-b border-forest/10">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <span class="font-extrabold tracking-tight text-forest">CHINA SOURCE <span class="text-orange">GH</span></span>
      <button onclick="logout()" class="text-sm font-medium text-forest/60 hover:text-orange">Logout</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="mb-8">
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Good day</h1>
      <p id="dateDisplay" class="text-forest/50 text-sm mt-1"></p>
    </div>

    <h2 class="text-xs font-bold uppercase tracking-wider text-forest/50 mb-3">Today’s operations</h2>
    <div id="cards" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
      <!-- filled by JS -->
    </div>

    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <a href="requests.html" class="flex-1 bg-orange text-white text-center py-3.5 rounded-full font-bold hover:bg-orangsoft transition">
        Sourcing Requests
      </a>
      <a href="orders.html" class="flex-1 bg-white border-2 border-forest text-forest text-center py-3.5 rounded-full font-bold hover:bg-forest hover:text-cream transition">
        Orders
      </a>
    </div>
    <a href="settings.html" class="block text-center text-sm font-medium text-forest/50 hover:text-forest">Settings</a>
  </main>

  <nav class="fixed bottom-0 inset-x-0 bg-cream border-t border-forest/10">
    <div class="max-w-5xl mx-auto flex justify-around py-2.5 text-xs font-medium">
      <a href="index.html" class="flex flex-col items-center text-orange py-1 gap-0.5 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-4 0v-4a1 1 0 011-1h2a1 1 0 011 1v4"/></svg>
        Home
      </a>
      <a href="requests.html" class="flex flex-col items-center text-forest/50 py-1 gap-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Requests
      </a>
      <a href="orders.html" class="flex flex-col items-center text-forest/50 py-1 gap-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Orders
      </a>
      <a href="settings.html" class="flex flex-col items-center text-forest/50 py-1 gap-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        Settings
      </a>
    </div>
  </nav>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    async function init() {
      if (!(await Auth.requireAuth())) return;

      const res = await API.getDashboard(Auth.getToken());
      if (!res.success) {
        showToast(res.error || 'Failed to load', 'error');
        return;
      }

      document.getElementById('dateDisplay').textContent = res.date || '';

      const c = res.counts || {};
      const items = [
        { label: 'New Requests', value: c.newRequests, href: 'requests.html?status=NEW', bg: 'bg-softpink' },
        { label: 'To Source', value: c.toSource, href: 'requests.html?status=SOURCING', bg: 'bg-softyellow' },
        { label: 'Quotes Waiting', value: c.quotesAwaiting, href: 'requests.html?status=QUOTED', bg: 'bg-softgreen' },
        { label: 'Awaiting Payment', value: c.awaitingPayment, href: 'orders.html', bg: 'bg-orange/20' },
        { label: 'Ready to Purchase', value: c.readyToPurchase, href: 'orders.html', bg: 'bg-softgreen' },
        { label: 'In Procurement', value: c.inProcurement, href: 'orders.html', bg: 'bg-softpink' },
        { label: 'In Transit', value: c.inTransit, href: 'orders.html', bg: 'bg-softyellow' },
        { label: 'Ready for Delivery', value: c.readyDelivery, href: 'orders.html', bg: 'bg-softgreen' }
      ];

      document.getElementById('cards').innerHTML = items.map(item =>
        '<a href="' + item.href + '" class="block ' + item.bg + ' rounded-4xl p-4 hover:opacity-90 transition">' +
          '<p class="text-2xl md:text-3xl font-extrabold">' + (item.value || 0) + '</p>' +
          '<p class="text-xs font-bold mt-1 leading-tight text-forest/70">' + item.label + '</p>' +
        '</a>'
      ).join('');
    }

    function logout() {
      Auth.clear();
      window.location.href = 'login.html';
    }

    init();
  </script>
</body>
</html>
