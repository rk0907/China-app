<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — China Source GH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a; --gray: #6b6b6b; --light: #f5f5f5;
      --white: #ffffff; --border: #e8e8e8;
    }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background: var(--white); color: var(--black);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    #loginView {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .login-box { width: 100%; max-width: 360px; text-align: center; }
    .login-logo {
      width: 44px; height: 44px; background: var(--black); color: var(--white);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 0.8rem; border-radius: 10px; margin-bottom: 1.25rem;
    }
    .login-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    .login-title em { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; }
    .login-sub { font-size: 0.8rem; color: var(--gray); margin-bottom: 2rem; }
    .login-card { border: 1px solid var(--border); border-radius: 20px; padding: 1.75rem; text-align: left; }
    .login-card label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.4rem; }
    .login-card input {
      width: 100%; padding: 0.85rem 1.1rem; border: 1.5px solid var(--border);
      border-radius: 999px; background: var(--light); font-family: inherit; font-size: 0.9rem;
      outline: none; margin-bottom: 1rem;
    }
    .login-card input:focus { border-color: var(--black); background: var(--white); }
    .btn-black {
      width: 100%; padding: 0.9rem; border-radius: 999px; background: var(--black);
      color: var(--white); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em;
    }
    .btn-black:hover { background: #333; }
    .login-hint { font-size: 0.7rem; color: var(--gray); margin-top: 1rem; text-align: center; }
    .login-hint code { background: var(--light); padding: 0.15rem 0.4rem; border-radius: 4px; }
    #loginError { color: #c00; font-size: 0.8rem; text-align: center; margin-top: 0.75rem; display: none; }

    #appView { display: none; padding-bottom: 5rem; }
    .nav {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 0.6rem; }
    .logo {
      width: 32px; height: 32px; background: var(--black); color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 0.65rem; border-radius: 7px;
    }
    .nav-badge {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
      padding: 0.25rem 0.65rem; border-radius: 999px; background: var(--light); color: var(--gray);
    }
    .nav-logout { font-size: 0.75rem; font-weight: 500; color: var(--gray); }
    .rate-pill {
      font-size: 0.6rem; font-weight: 600; color: var(--gray);
      padding: 0.25rem 0.55rem; border-radius: 999px; background: var(--light);
    }
    .rate-pill.live { color: #2e7d32; }

    main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem; }
    .page-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); margin-bottom: 0.4rem; }
    .page-title { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.35rem; }
    .page-sub { font-size: 0.85rem; color: var(--gray); margin-bottom: 1.75rem; }

    .ops-label { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); margin-bottom: 0.75rem; }
    .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.75rem; }
    @media (min-width: 560px) { .dash-grid { grid-template-columns: repeat(3, 1fr); } }
    .dash-card {
      border: 1px solid var(--border); border-radius: 16px; padding: 1.15rem;
      text-align: left; transition: border-color 0.2s; width: 100%;
    }
    .dash-card:hover { border-color: var(--black); background: var(--light); }
    .dash-card .num { font-size: 1.75rem; font-weight: 800; }
    .dash-card .lbl { font-size: 0.7rem; font-weight: 600; color: var(--gray); margin-top: 0.25rem; }

    .dash-actions { display: flex; flex-direction: column; gap: 0.6rem; }
    @media (min-width: 480px) { .dash-actions { flex-direction: row; } }
    .btn-pill {
      flex: 1; padding: 0.9rem 1.25rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em;
      border: 1.5px solid var(--black); transition: all 0.2s; text-align: center;
    }
    .btn-pill.filled { background: var(--black); color: var(--white); }
    .btn-pill.filled:hover { background: #333; }
    .btn-pill:not(.filled):hover { background: var(--black); color: var(--white); }

    .filters { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.75rem; margin-bottom: 1rem; }
    .filter-btn {
      flex-shrink: 0; padding: 0.4rem 0.9rem; border-radius: 999px;
      font-size: 0.7rem; font-weight: 600; border: 1.5px solid var(--border); color: var(--gray);
    }
    .filter-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

    .list-card {
      width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 16px;
      padding: 1.15rem; margin-bottom: 0.65rem; transition: border-color 0.2s;
    }
    .list-card:hover { border-color: var(--black); }
    .list-top { display: flex; justify-content: space-between; margin-bottom: 0.35rem; }
    .list-id { font-family: monospace; font-size: 0.8rem; font-weight: 700; }
    .badge {
      font-size: 0.6rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 999px;
      background: var(--light); color: var(--gray);
    }
    .badge.dark { background: var(--black); color: var(--white); }
    .list-title { font-weight: 700; font-size: 0.95rem; }
    .list-meta { font-size: 0.8rem; color: var(--gray); }
    .list-foot { display: flex; gap: 0.85rem; margin-top: 0.55rem; font-size: 0.7rem; color: var(--gray); font-weight: 500; }
    .empty { text-align: center; padding: 3.5rem 1rem; color: var(--gray); font-size: 0.9rem; line-height: 1.6; }

    .detail-card { border: 1px solid var(--border); border-radius: 16px; padding: 1.35rem; margin-bottom: 0.85rem; }
    .detail-label { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); margin-bottom: 0.75rem; }
    .detail-name { font-weight: 700; font-size: 1rem; }
    .detail-sub { font-size: 0.85rem; color: var(--gray); margin-top: 0.2rem; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.85rem; font-size: 0.85rem; }
    .detail-grid span { color: var(--gray); }
    .status-btns { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .status-btn {
      padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600;
      border: 1.5px solid var(--border);
    }
    .status-btn:hover, .status-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }
    .back-link { font-size: 0.8rem; font-weight: 500; color: var(--gray); margin-bottom: 1.25rem; display: inline-block; }

    .calc-field { margin-bottom: 0.85rem; }
    .calc-field label { display: block; font-size: 0.7rem; font-weight: 600; margin-bottom: 0.3rem; }
    .calc-field input, .calc-field select {
      width: 100%; padding: 0.7rem 1rem; border: 1.5px solid var(--border);
      border-radius: 999px; background: var(--light); font-family: inherit; font-size: 0.85rem; outline: none;
    }
    .calc-field input:focus, .calc-field select:focus { border-color: var(--black); background: var(--white); }
    .calc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .calc-tabs { display: flex; gap: 0.35rem; margin-bottom: 1rem; }
    .calc-tab {
      flex: 1; padding: 0.55rem; border-radius: 999px; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.03em; border: 1.5px solid var(--border); color: var(--gray); text-align: center;
    }
    .calc-tab.active { background: var(--black); color: var(--white); border-color: var(--black); }

    .cur-toggle {
      display: flex; gap: 0.3rem; margin-bottom: 0.85rem;
    }
    .cur-btn {
      flex: 1; padding: 0.45rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700;
      border: 1.5px solid var(--border); color: var(--gray); text-align: center;
    }
    .cur-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

    .result-box { background: var(--light); border-radius: 14px; padding: 1.15rem; margin-top: 0.5rem; }
    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.4rem 0; font-size: 0.85rem; border-bottom: 1px solid var(--border);
    }
    .result-row:last-child { border-bottom: none; }
    .result-row .lbl { color: var(--gray); font-weight: 500; }
    .result-row .val { font-weight: 700; }
    .result-row.highlight {
      background: var(--black); color: var(--white); margin: 0.5rem -1.15rem -1.15rem;
      padding: 0.9rem 1.15rem; border-radius: 0 0 14px 14px; border: none;
    }
    .result-row.highlight .lbl { color: rgba(255,255,255,0.7); }
    .budget-warn {
      font-size: 0.75rem; font-weight: 600; margin-top: 0.65rem; padding: 0.5rem 0.75rem;
      border-radius: 10px; display: none;
    }
    .budget-warn.ok { display: block; background: #e8f5e9; color: #2e7d32; }
    .budget-warn.over { display: block; background: #fce4ec; color: #c62828; }
    .rate-note {
      font-size: 0.65rem; color: var(--gray); margin-top: 0.35rem;
      display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
    }
    .rate-note button {
      font-size: 0.65rem; font-weight: 700; text-decoration: underline; color: var(--black);
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 0.6rem 0;
    }
    .bn-btn {
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      font-size: 0.6rem; font-weight: 600; color: var(--gray); padding: 0.35rem 1rem;
    }
    .bn-btn.active { color: var(--black); }
    .bn-btn svg { width: 20px; height: 20px; }
    .section { display: none; }
    .section.active { display: block; }
  </style>
</head>
<body>

  <div id="loginView">
    <div class="login-box">
      <div class="login-logo">CS</div>
      <h1 class="login-title">Admin <em>panel</em></h1>
      <p class="login-sub">China Source GH</p>
      <form id="loginForm" class="login-card">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Enter password" autofocus />
        <button type="submit" class="btn-black">SIGN IN</button>
        <p id="loginError"></p>
      </form>
      <p class="login-hint">Default: <code>admin123</code></p>
    </div>
  </div>

  <div id="appView">
    <nav class="nav">
      <div class="nav-left">
        <span class="logo">CS</span>
        <span class="nav-badge">ADMIN</span>
        <span class="rate-pill" id="rateStatus">Rates…</span>
      </div>
      <button class="nav-logout" onclick="logout()">Logout</button>
    </nav>

    <main>
      <section id="sec-dashboard" class="section">
        <p class="page-label">Overview</p>
        <h1 class="page-title" id="greet">Good day</h1>
        <p class="page-sub" id="dateEl"></p>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
          <p class="ops-label" style="margin:0">Revenue snapshot</p>
          <div class="cur-toggle" style="margin:0;max-width:200px">
            <button type="button" class="cur-btn active" id="dashCurGhs" onclick="setDashCur('GHS')">GHS</button>
            <button type="button" class="cur-btn" id="dashCurRmb" onclick="setDashCur('RMB')">RMB</button>
            <button type="button" class="cur-btn" id="dashCurUsd" onclick="setDashCur('USD')">USD</button>
          </div>
        </div>
        <div class="dash-grid" id="financeCards" style="margin-bottom:1.75rem"></div>

        <p class="ops-label">Pipeline</p>
        <div class="dash-grid" id="dashCards"></div>
        <div class="dash-actions">
          <button class="btn-pill filled" onclick="show('requests')">SOURCING REQUESTS</button>
          <button class="btn-pill" onclick="show('orders')">ORDERS</button>
        </div>
      </section>

      <section id="sec-requests" class="section">
        <button class="back-link" onclick="show('dashboard')">← Dashboard</button>
        <h1 class="page-title">Requests</h1>
        <p class="page-sub">All customer sourcing requests</p>
        <div class="filters">
          <button class="filter-btn active" data-f="ALL" onclick="filterReq('ALL')">All</button>
          <button class="filter-btn" data-f="NEW" onclick="filterReq('NEW')">New</button>
          <button class="filter-btn" data-f="SOURCING" onclick="filterReq('SOURCING')">Sourcing</button>
          <button class="filter-btn" data-f="QUOTED" onclick="filterReq('QUOTED')">Quoted</button>
          <button class="filter-btn" data-f="ACCEPTED" onclick="filterReq('ACCEPTED')">Accepted</button>
        </div>
        <div id="reqList"></div>
      </section>

      <section id="sec-detail" class="section">
        <button class="back-link" onclick="show('requests')">← Requests</button>
        <h1 class="page-title" style="font-family:monospace;font-size:1.3rem" id="detailId"></h1>
        <div id="detailBody"></div>
      </section>

      <section id="sec-orders" class="section">
        <button class="back-link" onclick="show('dashboard')">← Dashboard</button>
        <h1 class="page-title">Orders</h1>
        <p class="page-sub">Payment and procurement pipeline</p>
        <div id="orderList"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="bn-btn active" data-s="dashboard" onclick="show('dashboard')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h3m8-10v10h3m-6 0v-4h2v4"/></svg>
        Home
      </button>
      <button class="bn-btn" data-s="requests" onclick="show('requests')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Requests
      </button>
      <button class="bn-btn" data-s="orders" onclick="show('orders')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Orders
      </button>
    </nav>
  </div>

  <script>
    const ADMIN_PASS = 'admin123';

    // ═══════════════════════════════════════════════════════════
    //  PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW
    //  (same URL as in request.html — see SETUP.md)
    // ═══════════════════════════════════════════════════════════
    const API = 'https://script.google.com/macros/s/AKfycbz0IbJf3EFUe34AnzYCcwHwIOHoLGATdDhvRFFgLQkF5sEWYMkffY48F5XZPa07PLXToA/exec';

    // Live rates (fetched) + fallbacks
    let RATES = {
      rmb_to_ghs: 1.64,
      usd_to_ghs: 11.07,
      live: false,
      updated: null
    };

    let currentReqBudget = 0;
    // In-memory cache filled from Google Sheets
    let CACHE = { requests: [], orders: [] };

    async function apiGet(action) {
      if (API.includes('YOUR_DEPLOYMENT_ID')) {
        throw new Error('Paste your Apps Script URL into admin.html (see SETUP.md)');
      }
      const res = await fetch(API + '?action=' + encodeURIComponent(action));
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'API error');
      return json;
    }

    async function apiPost(payload) {
      if (API.includes('YOUR_DEPLOYMENT_ID')) {
        throw new Error('Paste your Apps Script URL into admin.html (see SETUP.md)');
      }
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'API error');
      return json;
    }

    async function refreshData() {
      const [reqJson, ordJson] = await Promise.all([
        apiGet('listRequests'),
        apiGet('listOrders')
      ]);
      CACHE.requests = reqJson.requests || [];
      CACHE.orders = ordJson.orders || [];
    }

    async function fetchLiveRates() {
      const status = document.getElementById('rateStatus');
      try {
        const [cnyRes, usdRes] = await Promise.all([
          fetch('https://open.er-api.com/v6/latest/CNY'),
          fetch('https://open.er-api.com/v6/latest/USD')
        ]);
        const cny = await cnyRes.json();
        const usd = await usdRes.json();
        if (cny.result === 'success' && cny.rates.GHS) {
          RATES.rmb_to_ghs = Math.round(cny.rates.GHS * 10000) / 10000;
        }
        if (usd.result === 'success' && usd.rates.GHS) {
          RATES.usd_to_ghs = Math.round(usd.rates.GHS * 10000) / 10000;
        }
        RATES.live = true;
        RATES.updated = new Date();
        if (status) {
          status.textContent = 'Live rates';
          status.classList.add('live');
        }
      } catch (e) {
        RATES.live = false;
        if (status) status.textContent = 'Offline rates';
      }
    }

    function isLoggedIn() { return sessionStorage.getItem('cs_admin') === '1'; }
    function logout() { sessionStorage.removeItem('cs_admin'); location.reload(); }

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      if (document.getElementById('password').value === ADMIN_PASS) {
        sessionStorage.setItem('cs_admin', '1');
        startApp();
      } else {
        const err = document.getElementById('loginError');
        err.textContent = 'Wrong password';
        err.style.display = 'block';
      }
    });

    if (isLoggedIn()) startApp();

    async function startApp() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('appView').style.display = 'block';
      const h = new Date().getHours();
      document.getElementById('greet').textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      document.getElementById('dateEl').textContent = new Date().toLocaleDateString('en-GB', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
      await fetchLiveRates();
      try {
        await refreshData();
      } catch (err) {
        alert('Could not load data from Google Sheets.\n\n' + err.message + '\n\nSee SETUP.md');
      }
      show('dashboard');
    }

    function getRequests() { return CACHE.requests; }
    function getOrders() { return CACHE.orders; }

    function show(sec) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('sec-' + sec).classList.add('active');
      document.querySelectorAll('.bn-btn').forEach(b => {
        const on = b.dataset.s === sec || (sec === 'detail' && b.dataset.s === 'requests');
        b.classList.toggle('active', on);
      });
      if (sec === 'dashboard') renderDash();
      if (sec === 'requests') renderRequests(reqFilter);
      if (sec === 'orders') renderOrders();
    }

    let dashCur = 'GHS';

    function setDashCur(c) {
      dashCur = c;
      document.getElementById('dashCurGhs').classList.toggle('active', c === 'GHS');
      document.getElementById('dashCurRmb').classList.toggle('active', c === 'RMB');
      document.getElementById('dashCurUsd').classList.toggle('active', c === 'USD');
      renderDash();
    }

    // Convert GHS amount → display currency using live rates
    function toDashCur(ghs) {
      const n = Number(ghs) || 0;
      if (dashCur === 'RMB') return { v: RATES.rmb_to_ghs > 0 ? n / RATES.rmb_to_ghs : 0, p: '¥ ' };
      if (dashCur === 'USD') return { v: RATES.usd_to_ghs > 0 ? n / RATES.usd_to_ghs : 0, p: '$ ' };
      return { v: n, p: 'GH₵ ' };
    }

    function renderDash() {
      const reqs = getRequests();
      const orders = getOrders();

      // Finance totals (stored in GHS on each order)
      let commissionGhs = 0, airfreightGhs = 0, revenueGhs = 0, productGhs = 0;
      orders.forEach(o => {
        const amt = parseFloat(o.amount) || 0;
        revenueGhs += amt;
        commissionGhs += parseFloat(o.commission_ghs) || 0;
        airfreightGhs += parseFloat(o.airfreight_ghs) || 0;
        productGhs += parseFloat(o.product_ghs) || 0;
      });
      // If older orders lack breakdown, treat remainder as product
      if (productGhs === 0 && revenueGhs > 0) {
        productGhs = Math.max(0, revenueGhs - commissionGhs - airfreightGhs);
      }

      const fin = [
        { key: 'commission', label: 'Commission earned', ghs: commissionGhs },
        { key: 'airfreight', label: 'Airfreight collected', ghs: airfreightGhs },
        { key: 'product', label: 'Product cost (sourced)', ghs: productGhs },
        { key: 'revenue', label: 'Total invoiced', ghs: revenueGhs }
      ];

      document.getElementById('financeCards').innerHTML = fin.map(f => {
        const d = toDashCur(f.ghs);
        return `<div class="dash-card" style="cursor:default">
          <div class="num" style="font-size:1.25rem">${d.p}${fmt(d.v)}</div>
          <div class="lbl">${f.label}</div>
        </div>`;
      }).join('');

      const cards = [
        { v: reqs.filter(r => r.status === 'NEW').length, l: 'New Requests', go: () => { filterReq('NEW'); show('requests'); } },
        { v: reqs.filter(r => r.status === 'SOURCING').length, l: 'Sourcing', go: () => { filterReq('SOURCING'); show('requests'); } },
        { v: reqs.filter(r => r.status === 'QUOTED').length, l: 'Quoted', go: () => { filterReq('QUOTED'); show('requests'); } },
        { v: orders.filter(o => o.payment_status !== 'CONFIRMED').length, l: 'Awaiting Payment', go: () => show('orders') },
        { v: orders.filter(o => o.payment_status === 'CONFIRMED').length, l: 'Ready to Buy', go: () => show('orders') },
        { v: reqs.length, l: 'Total Requests', go: () => show('requests') }
      ];
      document.getElementById('dashCards').innerHTML = cards.map((c, i) =>
        `<button class="dash-card" data-i="${i}"><div class="num">${c.v}</div><div class="lbl">${c.l}</div></button>`
      ).join('');
      document.querySelectorAll('#dashCards .dash-card').forEach((btn, i) => { btn.onclick = cards[i].go; });
    }

    let reqFilter = 'ALL';
    function filterReq(f) {
      reqFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
      renderRequests(f);
    }

    function renderRequests(f) {
      let list = getRequests();
      if (f && f !== 'ALL') list = list.filter(r => r.status === f);
      const el = document.getElementById('reqList');
      if (!list.length) {
        el.innerHTML = '<div class="empty">No requests yet.<br>Submit one from the request form.</div>';
        return;
      }
      el.innerHTML = list.map(r => `
        <button class="list-card" onclick="openDetail('${r.id}')">
          <div class="list-top">
            <span class="list-id">${r.id}</span>
            <span class="badge ${r.status === 'NEW' ? 'dark' : ''}">${r.status}</span>
          </div>
          <div class="list-title">${r.item || r.item_summary || '—'}</div>
          <div class="list-meta">${r.name || ''} · ${r.whatsapp || ''}</div>
          <div class="list-foot">
            <span>Qty ${r.quantity || 1}</span>
            ${r.budget || r.budget_ghs ? '<span>GH₵' + (r.budget || r.budget_ghs) + '</span>' : ''}
            <span>${fmtDate(r.created)}</span>
          </div>
        </button>
      `).join('');
    }

    function fmtDate(iso) {
      if (!iso) return '';
      try { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
      catch(e) { return ''; }
    }

    function fmt(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return Number(n).toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function openDetail(id) {
      const r = getRequests().find(x => x.id === id);
      if (!r) return;
      const budget = parseFloat(r.budget || r.budget_ghs) || 0;
      const qty = parseInt(r.quantity) || 1;
      currentReqBudget = budget;

      document.getElementById('detailId').textContent = r.id;
      document.getElementById('detailBody').innerHTML = `
        <div class="detail-card">
          <p class="detail-label">Customer</p>
          <p class="detail-name">${r.name || '—'}</p>
          <p class="detail-sub">${r.whatsapp || ''} ${r.email ? '· ' + r.email : ''}</p>
          <p class="detail-sub">${r.location || ''}</p>
        </div>
        <div class="detail-card">
          <p class="detail-label">Request</p>
          <p class="detail-name">${r.item || r.item_summary || '—'}</p>
          <p class="detail-sub" style="white-space:pre-line;margin-top:0.5rem">${r.description || ''}</p>
          <div class="detail-grid">
            <div><span>Category</span> ${r.category || '—'}</div>
            <div><span>Qty</span> ${qty}</div>
            <div><span>Budget</span> ${budget ? 'GH₵ ' + budget : '—'}</div>
            <div><span>Quality</span> ${r.quality || '—'}</div>
            ${r.size ? '<div><span>Size</span> ' + r.size + '</div>' : ''}
            ${r.colour ? '<div><span>Colour</span> ' + r.colour + '</div>' : ''}
            ${r.brand ? '<div><span>Brand</span> ' + r.brand + '</div>' : ''}
          </div>
          ${r.notes ? '<p class="detail-sub" style="margin-top:0.75rem;font-style:italic">"' + r.notes + '"</p>' : ''}
          ${r.url ? '<a href="' + r.url + '" target="_blank" class="detail-sub" style="display:inline-block;margin-top:0.5rem;text-decoration:underline">Product link →</a>' : ''}
        </div>

        <div class="detail-card">
          <p class="detail-label">Quote calculator</p>
          <div class="calc-tabs">
            <button type="button" class="calc-tab active" id="tabFwd" onclick="switchCalc('fwd')">FORWARD · Landed</button>
            <button type="button" class="calc-tab" id="tabRev" onclick="switchCalc('rev')">REVERSE · Source max</button>
          </div>

          <!-- FORWARD -->
          <div id="calcFwd">
            <p style="font-size:0.8rem;color:var(--gray);margin-bottom:0.85rem;line-height:1.5">
              Enter supplier cost → get landed price in GHS for the customer.
            </p>
            <div class="calc-row">
              <div class="calc-field">
                <label>Item cost (China)</label>
                <input type="number" id="cCost" step="0.01" min="0" placeholder="0.00" oninput="runCalc()" />
              </div>
              <div class="calc-field">
                <label>Cost currency</label>
                <div class="cur-toggle" style="margin:0">
                  <button type="button" class="cur-btn active" id="curRmb" onclick="setCostCur('RMB')">RMB</button>
                  <button type="button" class="cur-btn" id="curUsd" onclick="setCostCur('USD')">USD</button>
                </div>
                <input type="hidden" id="cCurrency" value="RMB" />
              </div>
            </div>
            <div class="calc-row">
              <div class="calc-field">
                <label>RMB → GHS</label>
                <input type="number" id="cRateRmb" step="0.0001" value="${RATES.rmb_to_ghs}" oninput="runCalc()" />
              </div>
              <div class="calc-field">
                <label>USD → GHS</label>
                <input type="number" id="cRateUsd" step="0.0001" value="${RATES.usd_to_ghs}" oninput="runCalc()" />
              </div>
            </div>
            <p class="rate-note">
              ${RATES.live ? '● Live rates loaded' : '○ Using fallback rates'}
              <button type="button" onclick="refreshRates()">Refresh rates</button>
            </p>
            <div class="calc-row">
              <div class="calc-field">
                <label>Commission %</label>
                <input type="number" id="cComm" step="0.1" min="0" value="10" oninput="runCalc()" />
              </div>
              <div class="calc-field">
                <label>Airfreight (GHS)</label>
                <input type="number" id="cShip" step="0.01" min="0" value="0" oninput="runCalc()" />
              </div>
            </div>
            <div class="calc-field">
              <label>Quantity</label>
              <input type="number" id="cQty" min="1" value="${qty}" oninput="runCalc()" />
            </div>
            <div class="result-box">
              <div class="result-row"><span class="lbl">Product (GHS)</span><span class="val" id="rProduct">—</span></div>
              <div class="result-row"><span class="lbl">Commission</span><span class="val" id="rComm">—</span></div>
              <div class="result-row"><span class="lbl">Airfreight</span><span class="val" id="rShip">—</span></div>
              <div class="result-row highlight">
                <span class="lbl">Landed total (GHS)</span>
                <span class="val" id="rLanded">—</span>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:0.5rem;font-size:0.8rem;color:var(--gray)">
              <span>Unit landed</span><span id="rUnit" style="font-weight:600">—</span>
            </div>
            <div class="budget-warn" id="budgetWarn"></div>
          </div>

          <!-- REVERSE -->
          <div id="calcRev" style="display:none">
            <p style="font-size:0.8rem;color:var(--gray);margin-bottom:0.85rem;line-height:1.5">
              Start from customer budget. Airfreight and commission are subtracted, then converted to max you can spend in China.
            </p>
            <div class="calc-field">
              <label>Customer budget (GHS)</label>
              <input type="number" id="rBudget" step="0.01" min="0" value="${budget || ''}" placeholder="0.00" oninput="runCalc()" />
            </div>
            <div class="calc-row">
              <div class="calc-field">
                <label>Commission %</label>
                <input type="number" id="rCommPct" step="0.1" min="0" value="10" oninput="runCalc()" />
              </div>
              <div class="calc-field">
                <label>Airfreight (GHS)</label>
                <input type="number" id="rShip" step="0.01" min="0" value="0" oninput="runCalc()" />
              </div>
            </div>
            <div class="calc-row">
              <div class="calc-field">
                <label>RMB → GHS</label>
                <input type="number" id="rRateRmb" step="0.0001" value="${RATES.rmb_to_ghs}" oninput="runCalc()" />
              </div>
              <div class="calc-field">
                <label>USD → GHS</label>
                <input type="number" id="rRateUsd" step="0.0001" value="${RATES.usd_to_ghs}" oninput="runCalc()" />
              </div>
            </div>
            <p class="rate-note">
              ${RATES.live ? '● Live rates loaded' : '○ Using fallback rates'}
              <button type="button" onclick="refreshRates()">Refresh rates</button>
            </p>
            <div class="calc-field">
              <label>Show max spend as</label>
              <div class="cur-toggle">
                <button type="button" class="cur-btn active" id="outRmb" onclick="setOutCur('RMB')">RMB</button>
                <button type="button" class="cur-btn" id="outUsd" onclick="setOutCur('USD')">USD</button>
                <button type="button" class="cur-btn" id="outGhs" onclick="setOutCur('GHS')">GHS</button>
              </div>
              <input type="hidden" id="rOutCur" value="RMB" />
            </div>
            <div class="result-box">
              <div class="result-row"><span class="lbl">Customer budget</span><span class="val" id="rvBudget">—</span></div>
              <div class="result-row"><span class="lbl">− Airfreight</span><span class="val" id="rvShip">—</span></div>
              <div class="result-row"><span class="lbl">= After airfreight</span><span class="val" id="rvAfterShip">—</span></div>
              <div class="result-row"><span class="lbl">− Commission (on product)</span><span class="val" id="rvComm">—</span></div>
              <div class="result-row"><span class="lbl">= Max product (GHS)</span><span class="val" id="rvProductGhs">—</span></div>
              <div class="result-row highlight">
                <span class="lbl" id="rvChinaLabel">Max spend in China (RMB)</span>
                <span class="val" id="rvChina">—</span>
              </div>
            </div>
            <p style="font-size:0.75rem;color:var(--gray);margin-top:0.75rem;line-height:1.5">
              Formula: (Budget − Airfreight) ÷ (1 + commission%) = max product GHS → convert to RMB/USD.
            </p>
          </div>
        </div>

        <div class="detail-card">
          <p class="detail-label">Update status</p>
          <div class="status-btns">
            ${['NEW','SOURCING','QUOTED','ACCEPTED'].map(s =>
              `<button class="status-btn ${r.status === s ? 'active' : ''}" onclick="setStatus('${r.id}','${s}')">${s}</button>`
            ).join('')}
          </div>
        </div>
        <div class="detail-card">
          <p class="detail-label">Create order</p>
          <button class="btn-black" style="margin-top:0.25rem" onclick="createOrder('${r.id}')">MARK ACCEPTED → CREATE ORDER</button>
        </div>
      `;
      show('detail');
      runCalc();
    }

    function setCostCur(c) {
      document.getElementById('cCurrency').value = c;
      document.getElementById('curRmb').classList.toggle('active', c === 'RMB');
      document.getElementById('curUsd').classList.toggle('active', c === 'USD');
      runCalc();
    }

    function setOutCur(c) {
      document.getElementById('rOutCur').value = c;
      document.getElementById('outRmb').classList.toggle('active', c === 'RMB');
      document.getElementById('outUsd').classList.toggle('active', c === 'USD');
      document.getElementById('outGhs').classList.toggle('active', c === 'GHS');
      runCalc();
    }

    function switchCalc(mode) {
      document.getElementById('calcFwd').style.display = mode === 'fwd' ? 'block' : 'none';
      document.getElementById('calcRev').style.display = mode === 'rev' ? 'block' : 'none';
      document.getElementById('tabFwd').classList.toggle('active', mode === 'fwd');
      document.getElementById('tabRev').classList.toggle('active', mode === 'rev');
      runCalc();
    }

    async function refreshRates() {
      const status = document.getElementById('rateStatus');
      if (status) status.textContent = 'Refreshing…';
      await fetchLiveRates();
      // Update inputs if calculator is open
      const cR = document.getElementById('cRateRmb');
      const cU = document.getElementById('cRateUsd');
      const rR = document.getElementById('rRateRmb');
      const rU = document.getElementById('rRateUsd');
      if (cR) cR.value = RATES.rmb_to_ghs;
      if (cU) cU.value = RATES.usd_to_ghs;
      if (rR) rR.value = RATES.rmb_to_ghs;
      if (rU) rU.value = RATES.usd_to_ghs;
      runCalc();
    }

    function runCalc() {
      // FORWARD
      if (document.getElementById('cCost')) {
        const cost = parseFloat(document.getElementById('cCost').value) || 0;
        const currency = document.getElementById('cCurrency').value || 'RMB';
        const rateRmb = parseFloat(document.getElementById('cRateRmb').value) || RATES.rmb_to_ghs;
        const rateUsd = parseFloat(document.getElementById('cRateUsd').value) || RATES.usd_to_ghs;
        const commPct = parseFloat(document.getElementById('cComm').value) || 0;
        const ship = parseFloat(document.getElementById('cShip').value) || 0;
        const qty = parseInt(document.getElementById('cQty').value) || 1;

        const rate = currency === 'USD' ? rateUsd : rateRmb;
        const productGhs = cost * rate;
        const commission = productGhs * (commPct / 100);
        const landed = productGhs + commission + ship;
        const unit = qty > 0 ? landed / qty : landed;

        document.getElementById('rProduct').textContent = 'GH₵ ' + fmt(productGhs);
        document.getElementById('rComm').textContent = 'GH₵ ' + fmt(commission) + ' (' + commPct + '%)';
        document.getElementById('rShip').textContent = 'GH₵ ' + fmt(ship);
        document.getElementById('rLanded').textContent = 'GH₵ ' + fmt(landed);
        document.getElementById('rUnit').textContent = 'GH₵ ' + fmt(unit);

        const warn = document.getElementById('budgetWarn');
        if (warn && currentReqBudget > 0 && cost > 0) {
          if (landed <= currentReqBudget) {
            warn.className = 'budget-warn ok';
            warn.textContent = 'Within budget · GH₵ ' + fmt(currentReqBudget - landed) + ' headroom';
          } else {
            warn.className = 'budget-warn over';
            warn.textContent = 'Over budget by GH₵ ' + fmt(landed - currentReqBudget);
          }
        } else if (warn) {
          warn.className = 'budget-warn';
        }
      }

      // REVERSE — always subtracts airfreight first
      if (document.getElementById('rBudget')) {
        const budget = parseFloat(document.getElementById('rBudget').value) || 0;
        const rCommPct = parseFloat(document.getElementById('rCommPct').value) || 0;
        const rShip = parseFloat(document.getElementById('rShip').value) || 0;
        const rRateRmb = parseFloat(document.getElementById('rRateRmb').value) || RATES.rmb_to_ghs;
        const rRateUsd = parseFloat(document.getElementById('rRateUsd').value) || RATES.usd_to_ghs;
        const outCur = document.getElementById('rOutCur').value || 'RMB';

        // budget = product + commission + airfreight
        // budget - airfreight = product * (1 + c/100)
        // product = (budget - airfreight) / (1 + c/100)
        const afterShip = Math.max(0, budget - rShip);
        const productGhs = rCommPct > 0 ? afterShip / (1 + rCommPct / 100) : afterShip;
        const commissionAmt = Math.max(0, afterShip - productGhs);

        let maxOut = productGhs;
        let label = 'Max product spend (GHS)';
        let prefix = 'GH₵ ';
        if (outCur === 'RMB') {
          maxOut = rRateRmb > 0 ? productGhs / rRateRmb : 0;
          label = 'Max spend in China (RMB)';
          prefix = '¥ ';
        } else if (outCur === 'USD') {
          maxOut = rRateUsd > 0 ? productGhs / rRateUsd : 0;
          label = 'Max spend in China (USD)';
          prefix = '$ ';
        }

        document.getElementById('rvBudget').textContent = 'GH₵ ' + fmt(budget);
        document.getElementById('rvShip').textContent = '− GH₵ ' + fmt(rShip);
        document.getElementById('rvAfterShip').textContent = 'GH₵ ' + fmt(afterShip);
        document.getElementById('rvComm').textContent = '− GH₵ ' + fmt(commissionAmt) + ' (' + rCommPct + '%)';
        document.getElementById('rvProductGhs').textContent = 'GH₵ ' + fmt(productGhs);
        document.getElementById('rvChinaLabel').textContent = label;
        document.getElementById('rvChina').textContent = prefix + fmt(maxOut);
      }
    }

    async function setStatus(id, status) {
      try {
        await apiPost({ action: 'updateStatus', id: id, status: status });
        await refreshData();
        openDetail(id);
      } catch (err) {
        alert('Could not update status: ' + err.message);
      }
    }

    async function createOrder(reqId) {
      const r = getRequests().find(x => x.id === reqId);
      if (!r) return;
      const orderId = 'ORD-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-5);

      let amount = parseFloat(r.budget || r.budget_ghs) || 0;
      let product_ghs = 0, commission_ghs = 0, airfreight_ghs = 0;
      let cost_china = 0, cost_currency = 'RMB';

      const costEl = document.getElementById('cCost');
      const shipEl = document.getElementById('cShip');
      const commEl = document.getElementById('cComm');
      const curEl = document.getElementById('cCurrency');
      const rateRmbEl = document.getElementById('cRateRmb');
      const rateUsdEl = document.getElementById('cRateUsd');

      if (costEl && parseFloat(costEl.value) > 0) {
        cost_china = parseFloat(costEl.value) || 0;
        cost_currency = curEl ? curEl.value : 'RMB';
        const rate = cost_currency === 'USD'
          ? (parseFloat(rateUsdEl && rateUsdEl.value) || RATES.usd_to_ghs)
          : (parseFloat(rateRmbEl && rateRmbEl.value) || RATES.rmb_to_ghs);
        const commPct = parseFloat(commEl && commEl.value) || 0;
        product_ghs = cost_china * rate;
        commission_ghs = product_ghs * (commPct / 100);
        airfreight_ghs = parseFloat(shipEl && shipEl.value) || 0;
        amount = product_ghs + commission_ghs + airfreight_ghs;
      } else {
        const landedEl = document.getElementById('rLanded');
        if (landedEl) {
          const n = parseFloat(String(landedEl.textContent).replace(/[^0-9.]/g, ''));
          if (n > 0) amount = n;
        }
      }

      try {
        await apiPost({
          action: 'createOrder',
          id: orderId,
          request_id: reqId,
          customer: r.name,
          whatsapp: r.whatsapp,
          item: r.item || r.item_summary,
          quantity: r.quantity || 1,
          amount: amount,
          product_ghs: product_ghs,
          commission_ghs: commission_ghs,
          airfreight_ghs: airfreight_ghs,
          cost_china: cost_china,
          cost_currency: cost_currency,
          payment_status: 'AWAITING'
        });
        await refreshData();
        alert('Order ' + orderId + ' created · GH₵ ' + fmt(amount));
        show('orders');
      } catch (err) {
        alert('Could not create order: ' + err.message);
      }
    }

    function renderOrders() {
      const list = getOrders();
      const el = document.getElementById('orderList');
      if (!list.length) {
        el.innerHTML = '<div class="empty">No orders yet.<br>Accept a request to create one.</div>';
        return;
      }
      el.innerHTML = list.map(o => `
        <div class="list-card" style="cursor:default">
          <div class="list-top">
            <span class="list-id">${o.id}</span>
            <span class="badge ${o.payment_status === 'CONFIRMED' ? 'dark' : ''}">${o.payment_status}</span>
          </div>
          <div class="list-title">${o.item || '—'}</div>
          <div class="list-meta">${o.customer || ''} · ${o.whatsapp || ''}</div>
          <div class="list-foot">
            <span style="font-weight:700;color:var(--black)">GH₵${fmt(o.amount || 0)}</span>
            <span>Qty ${o.quantity || 1}</span>
            <span>${fmtDate(o.created)}</span>
          </div>
          ${(o.commission_ghs || o.airfreight_ghs) ? `
            <div class="list-foot" style="margin-top:0.35rem">
              ${o.commission_ghs ? '<span>Commission GH₵' + fmt(o.commission_ghs) + '</span>' : ''}
              ${o.airfreight_ghs ? '<span>Airfreight GH₵' + fmt(o.airfreight_ghs) + '</span>' : ''}
            </div>
          ` : ''}
          ${o.payment_status !== 'CONFIRMED' ? `
            <button class="btn-black" style="margin-top:0.85rem;width:100%" onclick="confirmPay('${o.id}')">CONFIRM PAYMENT</button>
          ` : '<p style="margin-top:0.75rem;font-size:0.75rem;font-weight:600;color:var(--gray)">✓ Ready to purchase</p>'}
        </div>
      `).join('');
    }

    async function confirmPay(id) {
      try {
        await apiPost({ action: 'confirmPayment', id: id });
        await refreshData();
        renderOrders();
      } catch (err) {
        alert('Could not confirm payment: ' + err.message);
      }
    }
  </script>
</body>
</html>
