<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — China Source GH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-900 antialiased pb-20">

  <!-- Top bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <span class="font-semibold text-brand-900">China Source <span class="text-brand-600">GH</span></span>
      <div class="flex items-center gap-3 text-sm">
        <span id="adminEmail" class="text-slate-500 hidden sm:inline"></span>
        <button onclick="logout()" class="text-slate-600 hover:text-red-600">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="mb-6">
      <h1 class="text-2xl font-bold">Good day</h1>
      <p id="dateDisplay" class="text-slate-500 text-sm"></p>
    </div>

    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3">Today’s operations</h2>
    <div id="cards" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
      <!-- filled by JS -->
    </div>

    <div class="flex gap-3 mb-4">
      <a href="requests.html" class="flex-1 bg-brand-600 text-white text-center py-3 rounded-xl font-semibold hover:bg-brand-700">Sourcing Requests</a>
      <a href="orders.html" class="flex-1 bg-white border border-slate-300 text-center py-3 rounded-xl font-semibold hover:bg-slate-50">Orders</a>
    </div>
    <a href="settings.html" class="block text-center text-sm text-slate-500 hover:text-brand-700">Settings</a>
  </main>

  <!-- Bottom nav (mobile) -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 safe-area">
    <div class="max-w-5xl mx-auto flex justify-around py-2 text-xs">
      <a href="index.html" class="flex flex-col items-center text-brand-600 font-medium py-1">
        <span class="text-lg">⌂</span> Home
      </a>
      <a href="requests.html" class="flex flex-col items-center text-slate-500 py-1">
        <span class="text-lg">☰</span> Requests
      </a>
      <a href="orders.html" class="flex flex-col items-center text-slate-500 py-1">
        <span class="text-lg">📦</span> Orders
      </a>
      <a href="settings.html" class="flex flex-col items-center text-slate-500 py-1">
        <span class="text-lg">⚙</span> Settings
      </a>
    </div>
  </nav>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    async function init() {
      if (!(await Auth.requireAuth())) return;
      document.getElementById('adminEmail').textContent = Auth.getEmail() || '';

      const res = await API.getDashboard(Auth.getToken());
      if (!res.success) {
        showToast(res.error || 'Failed to load', 'error');
        return;
      }

      document.getElementById('dateDisplay').textContent = res.date || '';

      const c = res.counts || {};
      const items = [
        { label: 'New Requests', value: c.newRequests, href: 'requests.html?status=NEW', color: 'bg-blue-50 text-blue-800' },
        { label: 'To Source', value: c.toSource, href: 'requests.html?status=SOURCING', color: 'bg-purple-50 text-purple-800' },
        { label: 'Quotes Waiting', value: c.quotesAwaiting, href: 'requests.html?status=QUOTED', color: 'bg-amber-50 text-amber-800' },
        { label: 'Awaiting Payment', value: c.awaitingPayment, href: 'requests.html?status=AWAITING_PAYMENT', color: 'bg-orange-50 text-orange-800' },
        { label: 'Ready to Purchase', value: c.readyToPurchase, href: 'orders.html', color: 'bg-emerald-50 text-emerald-800' },
        { label: 'In Procurement', value: c.inProcurement, href: 'orders.html', color: 'bg-teal-50 text-teal-800' },
        { label: 'In Transit', value: c.inTransit, href: 'orders.html', color: 'bg-sky-50 text-sky-800' },
        { label: 'Ready for Delivery', value: c.readyDelivery, href: 'orders.html', color: 'bg-green-50 text-green-800' }
      ];

      document.getElementById('cards').innerHTML = items.map(item => `
        <a href="${item.href}" class="block ${item.color} rounded-xl p-4 hover:opacity-90 transition">
          <p class="text-2xl font-bold">${item.value || 0}</p>
          <p class="text-xs font-medium mt-1 leading-tight">${item.label}</p>
        </a>
      `).join('');
    }

    function logout() {
      Auth.clear();
      window.location.href = 'login.html';
    }

    init();
  </script>
</body>
</html>
