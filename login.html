<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — China Source GH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FBF6EE', forest: '#1A3A2A', orange: '#F07A3A', orangsoft: '#F5A06A'
          },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] },
          borderRadius: { '4xl': '2rem' }
        }
      }
    }
  </script>
  <style>body { font-family: 'DM Sans', system-ui, sans-serif; }</style>
</head>
<body class="bg-cream min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-xl font-extrabold tracking-tight text-forest">CHINA SOURCE <span class="text-orange">GH</span></h1>
      <p class="text-sm text-forest/50 mt-1 font-medium">Admin</p>
    </div>

    <form id="loginForm" class="bg-white rounded-4xl border border-forest/10 shadow-sm p-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1.5">Email</label>
        <input type="email" id="email" required class="w-full rounded-full border-2 border-forest/15 bg-cream/50 px-4 py-3 text-sm focus:outline-none focus:border-orange" />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1.5">Password</label>
        <input type="password" id="password" required class="w-full rounded-full border-2 border-forest/15 bg-cream/50 px-4 py-3 text-sm focus:outline-none focus:border-orange" />
      </div>
      <button type="submit" id="btn" class="w-full bg-orange text-white py-3 rounded-full font-bold hover:bg-orangsoft transition disabled:opacity-60">
        Sign in
      </button>
      <p id="error" class="text-sm text-orange text-center font-medium hidden"></p>
    </form>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    if (Auth.getToken()) window.location.href = 'index.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('error');
      btn.disabled = true;
      err.classList.add('hidden');

      const res = await API.adminLogin(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );

      if (res.success) {
        Auth.setToken(res.token);
        Auth.setEmail(res.email);
        window.location.href = 'index.html';
      } else {
        err.textContent = res.error || 'Login failed';
        err.classList.remove('hidden');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
