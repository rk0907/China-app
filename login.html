<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — China Source GH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-xl font-bold text-brand-900">China Source <span class="text-brand-600">GH</span></h1>
      <p class="text-sm text-slate-500 mt-1">Admin</p>
    </div>

    <form id="loginForm" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>
      <button type="submit" id="btn" class="w-full bg-brand-600 text-white py-2.5 rounded-lg font-semibold hover:bg-brand-700 disabled:opacity-60">
        Sign in
      </button>
      <p id="error" class="text-sm text-red-600 text-center hidden"></p>
    </form>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // If already logged in, go to dashboard
    if (Auth.getToken()) {
      window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('error');
      btn.disabled = true;
      err.classList.add('hidden');

      const res = await API.adminLogin(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );

      if (res.success) {
        Auth.setToken(res.token);
        Auth.setEmail(res.email);
        window.location.href = 'index.html';
      } else {
        err.textContent = res.error || 'Login failed';
        err.classList.remove('hidden');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
