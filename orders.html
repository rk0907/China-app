<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — China Source GH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FBF6EE',
            forest: '#1A3A2A',
            orange: '#F07A3A',
            orangsoft: '#F5A06A',
            softpink: '#F7C9D4',
            softyellow: '#F5E6A3',
            softgreen: '#D4E8D8'
          },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] },
          borderRadius: { '4xl': '2rem' }
        }
      }
    }
  </script>
  <style>body { font-family: 'DM Sans', system-ui, sans-serif; }</style>
</head>
<body class="bg-cream text-forest antialiased pb-24">

  <header class="sticky top-0 z-40 bg-cream/95 backdrop-blur border-b border-forest/10">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="font-bold text-forest text-sm">← Dashboard</a>
      <span class="font-extrabold tracking-tight">Orders</span>
      <span class="w-16"></span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Orders</h1>
      <p class="text-forest/60 text-sm mt-1">Accepted quotations & payment status</p>
    </div>

    <div class="flex gap-2 overflow-x-auto pb-3 mb-4">
      <button onclick="filterOrders('ALL')" class="filter-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-forest text-cream" data-f="ALL">All</button>
      <button onclick="filterOrders('PAYMENT_SUBMITTED')" class="filter-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-bold border-2 border-forest/20 text-forest" data-f="PAYMENT_SUBMITTED">Awaiting confirm</button>
      <button onclick="filterOrders('PAYMENT_CONFIRMED')" class="filter-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-bold border-2 border-forest/20 text-forest" data-f="PAYMENT_CONFIRMED">Paid</button>
      <button onclick="filterOrders('READY_TO_PURCHASE')" class="filter-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-bold border-2 border-forest/20 text-forest" data-f="READY_TO_PURCHASE">Ready to buy</button>
    </div>

    <div id="list" class="space-y-3">
      <p class="text-center text-forest/50 py-12">Loading orders...</p>
    </div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 bg-cream border-t border-forest/10">
    <div class="max-w-5xl mx-auto flex justify-around py-2.5 text-xs font-medium">
      <a href="index.html" class="flex flex-col items-center text-forest/50 py-1 gap-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-4 0v-4a1 1 0 011-1h2a1 1 0 011 1v4"/></svg>
        Home
      </a>
      <a href="requests.html" class="flex flex-col items-center text-forest/50 py-1 gap-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Requests
      </a>
      <a href="orders.html" class="flex flex-col items-center text-orange py-1 gap-0.5 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Orders
      </a>
      <a href="settings.html" class="flex flex-col items-center text-forest/50 py-1 gap-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        Settings
      </a>
    </div>
  </nav>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let allOrders = [];
    let currentFilter = 'ALL';

    function statusPill(status) {
      const map = {
        'AWAITING_PAYMENT': 'bg-softyellow text-forest',
        'PAYMENT_SUBMITTED': 'bg-orange/20 text-orange',
        'PAYMENT_CONFIRMED': 'bg-softgreen text-forest',
        'READY_TO_PURCHASE': 'bg-softgreen text-forest',
        'PURCHASING': 'bg-softpink text-forest',
        'COMPLETED': 'bg-forest text-cream'
      };
      const cls = map[status] || 'bg-forest/10 text-forest';
      return '<span class="inline-flex px-2.5 py-0.5 rounded-full text-[11px] font-bold ' + cls + '">' + (status || '').replace(/_/g, ' ') + '</span>';
    }

    function filterOrders(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        if (btn.dataset.f === f) {
          btn.className = 'filter-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-forest text-cream';
        } else {
          btn.className = 'filter-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-bold border-2 border-forest/20 text-forest';
        }
      });
      render();
    }

    function render() {
      let list = allOrders;
      if (currentFilter === 'PAYMENT_SUBMITTED') list = allOrders.filter(o => o.payment_status === 'PAYMENT_SUBMITTED');
      else if (currentFilter === 'PAYMENT_CONFIRMED') list = allOrders.filter(o => o.payment_status === 'PAYMENT_CONFIRMED');
      else if (currentFilter === 'READY_TO_PURCHASE') list = allOrders.filter(o => o.procurement_status === 'READY_TO_PURCHASE');

      const el = document.getElementById('list');
      if (!list.length) {
        el.innerHTML = '<div class="text-center py-16 text-forest/50"><p class="font-semibold">No orders here yet</p><p class="text-sm mt-1">Orders appear after a customer accepts a quotation</p></div>';
        return;
      }

      el.innerHTML = list.map(o => {
        let actions = '';
        if (o.payment_status === 'PAYMENT_SUBMITTED') {
          actions = '<div class="mt-4 flex gap-2">' +
            '<button onclick="confirmPay(\'' + o.order_id + '\')" class="flex-1 bg-orange text-white py-2.5 rounded-full text-sm font-bold hover:bg-orangsoft transition">Confirm payment</button>' +
            '<button onclick="rejectPay(\'' + o.order_id + '\')" class="px-5 border-2 border-forest/20 py-2.5 rounded-full text-sm font-bold hover:bg-forest/5 transition">Reject</button>' +
            '</div>';
        }
        return '<div class="bg-white rounded-4xl border border-forest/10 p-5 shadow-sm">' +
          '<div class="flex justify-between items-start gap-3 mb-2">' +
            '<span class="font-mono text-sm font-bold text-orange">' + o.order_id + '</span>' +
            statusPill(o.payment_status) +
          '</div>' +
          '<p class="font-bold text-lg leading-tight">' + (o.item_summary || '—') + '</p>' +
          '<p class="text-sm text-forest/60 mt-1">' + (o.customer_name || '') + (o.whatsapp ? ' · ' + o.whatsapp : '') + '</p>' +
          '<div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-xs text-forest/50">' +
            '<span class="font-semibold text-forest">' + formatMoney(o.amount_ghs) + '</span>' +
            '<span>Qty ' + (o.quantity || 1) + '</span>' +
            '<span>Proc: ' + (o.procurement_status || '—').replace(/_/g, ' ') + '</span>' +
            '<span>Ship: ' + (o.shipping_status || '—').replace(/_/g, ' ') + '</span>' +
          '</div>' + actions +
        '</div>';
      }).join('');
    }

    async function init() {
      if (!(await Auth.requireAuth())) return;
      const res = await API.getOrders(Auth.getToken());
      if (!res.success) {
        document.getElementById('list').innerHTML = '<p class="text-red-600 text-center py-8">' + res.error + '</p>';
        return;
      }
      allOrders = res.orders || [];
      render();
    }

    async function confirmPay(orderId) {
      const res = await API.confirmPayment(Auth.getToken(), { orderId, action: 'confirm' });
      if (res.success) { showToast(res.message || 'Payment confirmed'); init(); }
      else showToast(res.error || 'Failed', 'error');
    }

    async function rejectPay(orderId) {
      const res = await API.confirmPayment(Auth.getToken(), { orderId, action: 'reject' });
      if (res.success) { showToast(res.message || 'Payment rejected'); init(); }
      else showToast(res.error || 'Failed', 'error');
    }

    init();
  </script>
</body>
</html>
