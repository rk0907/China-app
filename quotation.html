<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Quotation — China Source GH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="font-semibold text-lg tracking-tight text-brand-900">China Source <span class="text-brand-600">GH</span></a>
    </div>
  </nav>

  <main class="max-w-lg mx-auto px-4 py-10">
    <div id="loading" class="text-center text-slate-500 py-12">Loading quotation...</div>
    <div id="expired" class="hidden text-center py-12">
      <p class="text-lg font-semibold text-amber-700 mb-2">This quotation has expired</p>
      <p class="text-slate-600 text-sm mb-6">Please request an updated quotation.</p>
      <a href="request.html" class="text-brand-600 font-medium">Submit a new request</a>
    </div>
    <div id="content" class="hidden">
      <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Quotation</p>
      <h1 id="qId" class="text-xl font-bold font-mono mb-1"></h1>
      <p id="qMeta" class="text-sm text-slate-600 mb-6"></p>

      <div id="options" class="space-y-4 mb-8"></div>

      <div id="acceptedMsg" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center">
        <p class="font-medium text-emerald-800">You have selected an option.</p>
        <p class="text-sm text-emerald-700 mt-1">Proceed to payment when ready.</p>
        <a id="payLink" href="#" class="inline-block mt-3 bg-brand-600 text-white px-5 py-2 rounded-lg text-sm font-medium">Go to payment</a>
      </div>
    </div>
    <div id="error" class="hidden text-center text-red-600 py-12"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const qId = qs('id');
    const token = qs('token');

    async function load() {
      if (!qId) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').textContent = 'Missing quotation ID';
        document.getElementById('error').classList.remove('hidden');
        return;
      }

      const res = await API.getQuotation(qId, token);
      document.getElementById('loading').classList.add('hidden');

      if (!res.success) {
        document.getElementById('error').textContent = res.error || 'Quotation not found';
        document.getElementById('error').classList.remove('hidden');
        return;
      }

      if (res.expired) {
        document.getElementById('expired').classList.remove('hidden');
        return;
      }

      document.getElementById('content').classList.remove('hidden');
      document.getElementById('qId').textContent = res.quotationId;
      document.getElementById('qMeta').textContent = `For ${res.customerName || 'you'} · Valid until ${formatDate(res.expiresAt)}`;

      const optionsEl = document.getElementById('options');
      const isAccepted = res.status === 'ACCEPTED';

      optionsEl.innerHTML = (res.options || []).map((opt, idx) => {
        const letter = String.fromCharCode(65 + idx);
        const selected = res.selectedOptionId === opt.optionId;
        return `
          <div class="bg-white rounded-2xl border ${selected ? 'border-emerald-400 ring-2 ring-emerald-100' : 'border-slate-200'} p-5">
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Option ${letter}</span>
              ${selected ? '<span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Selected</span>' : ''}
            </div>
            ${opt.imageUrl ? `<img src="${opt.imageUrl}" class="w-full h-40 object-cover rounded-lg mb-3" alt="">` : ''}
            <p class="font-medium mb-1">${opt.supplierName || 'Sourcing option'}</p>
            <p class="text-2xl font-bold text-brand-700 mb-2">${formatMoney(opt.finalPriceGhs)}</p>
            ${opt.deliveryEstimate ? `<p class="text-sm text-slate-600 mb-1">Est. delivery: ${opt.deliveryEstimate}</p>` : ''}
            ${opt.notes ? `<p class="text-sm text-slate-500 mb-3">${opt.notes}</p>` : ''}
            ${!isAccepted ? `
              <button onclick="selectOption('${opt.optionId}')" class="w-full mt-2 bg-brand-600 text-white py-2.5 rounded-lg font-medium hover:bg-brand-700 text-sm">
                Select this option
              </button>
            ` : ''}
          </div>
        `;
      }).join('');

      if (isAccepted && res.selectedOptionId) {
        document.getElementById('acceptedMsg').classList.remove('hidden');
        // We need orderId — for V1, customer goes via payment page with order lookup later
        // For now, link to a payment page that can accept orderId from accept response
      }
    }

    async function selectOption(optionId) {
      if (!confirm('Select this option and proceed to payment?')) return;
      const res = await API.acceptQuotation({ quotationId: qId, optionId, token });
      if (res.success) {
        showToast('Option selected');
        // Redirect to payment with orderId
        window.location.href = 'payment.html?order=' + encodeURIComponent(res.orderId) + '&amount=' + encodeURIComponent(res.amount);
      } else {
        showToast(res.error || 'Failed', 'error');
      }
    }

    load();
  </script>
</body>
</html>
