<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Request — China Source GH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FBF6EE', forest: '#1A3A2A', orange: '#F07A3A', orangsoft: '#F5A06A',
            softpink: '#F7C9D4', softyellow: '#F5E6A3', softgreen: '#D4E8D8'
          },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] },
          borderRadius: { '4xl': '2rem' }
        }
      }
    }
  </script>
  <style>body { font-family: 'DM Sans', system-ui, sans-serif; }</style>
</head>
<body class="bg-cream text-forest antialiased">

  <nav class="sticky top-0 z-40 bg-cream/95 backdrop-blur border-b border-forest/5">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="font-extrabold tracking-tight text-forest">CHINA SOURCE <span class="text-orange text-sm">GH</span></a>
      <a href="request.html" class="inline-flex items-center px-4 py-2 rounded-full bg-orange text-white text-sm font-bold hover:bg-orangsoft">Request an item</a>
    </div>
  </nav>

  <main class="max-w-lg mx-auto px-4 py-12">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight">Track your request</h1>
      <p class="text-forest/60 text-sm mt-2">Enter the Request ID you received after submitting.</p>
    </div>

    <form id="trackForm" class="flex gap-2 mb-8">
      <input type="text" id="requestIdInput" placeholder="SR-2026-00001" class="flex-1 rounded-full border-2 border-forest/15 bg-white px-5 py-3 text-sm font-mono focus:outline-none focus:border-orange" />
      <button type="submit" class="bg-orange text-white px-6 py-3 rounded-full font-bold hover:bg-orangsoft transition">Track</button>
    </form>

    <div id="result" class="hidden space-y-4">
      <div class="bg-white rounded-4xl border border-forest/10 p-5 shadow-sm">
        <p class="text-xs font-bold uppercase tracking-wider text-forest/40">Request</p>
        <p id="displayId" class="font-mono font-extrabold text-lg text-orange mt-1"></p>
        <p id="displayItem" class="text-forest/60 text-sm mt-1"></p>
        <div class="mt-3" id="displayStatus"></div>
      </div>

      <div class="bg-white rounded-4xl border border-forest/10 p-5 shadow-sm">
        <h2 class="text-xs font-bold uppercase tracking-wider text-forest/40 mb-4">Progress</h2>
        <ol id="timeline" class="space-y-3"></ol>
      </div>
    </div>

    <div id="error" class="hidden text-center text-orange font-medium text-sm py-8"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const form = document.getElementById('trackForm');
    const input = document.getElementById('requestIdInput');
    const result = document.getElementById('result');
    const errorEl = document.getElementById('error');

    const preId = qs('id');
    if (preId) { input.value = preId; track(preId); }

    form.addEventListener('submit', (e) => { e.preventDefault(); track(input.value.trim()); });

    async function track(id) {
      result.classList.add('hidden');
      errorEl.classList.add('hidden');
      if (!id) return;

      const res = await API.getRequestStatus(id);
      if (!res.success) {
        errorEl.textContent = res.error || 'Request not found';
        errorEl.classList.remove('hidden');
        return;
      }

      document.getElementById('displayId').textContent = res.requestId;
      document.getElementById('displayItem').textContent = res.item || '';
      document.getElementById('displayStatus').innerHTML = statusBadge(res.status);

      const timeline = document.getElementById('timeline');
      timeline.innerHTML = (res.timeline || []).map(step => {
        let icon = '○'; let cls = 'text-forest/30';
        if (step.state === 'done') { icon = '✓'; cls = 'text-forest'; }
        if (step.state === 'current') { icon = '●'; cls = 'text-orange font-bold'; }
        return '<li class="flex items-center gap-3 text-sm ' + cls + '"><span class="w-5 text-center text-base">' + icon + '</span><span>' + step.label + '</span></li>';
      }).join('');

      result.classList.remove('hidden');
    }
  </script>
</body>
</html>
