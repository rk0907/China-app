<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Request — China Source GH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="font-semibold text-lg tracking-tight text-brand-900">China Source <span class="text-brand-600">GH</span></a>
      <a href="request.html" class="text-sm bg-brand-600 text-white px-3 py-1.5 rounded-lg font-medium hover:bg-brand-700">Request an item</a>
    </div>
  </nav>

  <main class="max-w-lg mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold mb-2">Track your request</h1>
    <p class="text-slate-600 text-sm mb-6">Enter the Request ID you received after submitting.</p>

    <form id="trackForm" class="flex gap-2 mb-8">
      <input type="text" id="requestIdInput" placeholder="SR-2026-00001" class="flex-1 rounded-lg border border-slate-300 px-3 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand-500" />
      <button type="submit" class="bg-brand-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-brand-700">Track</button>
    </form>

    <div id="result" class="hidden">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 mb-4">
        <p class="text-xs text-slate-500 uppercase tracking-wider">Request</p>
        <p id="displayId" class="font-mono font-semibold text-lg"></p>
        <p id="displayItem" class="text-slate-600 text-sm mt-1"></p>
        <div class="mt-3" id="displayStatus"></div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 class="font-semibold mb-4 text-sm uppercase tracking-wider text-slate-500">Progress</h2>
        <ol id="timeline" class="space-y-3"></ol>
      </div>
    </div>

    <div id="error" class="hidden text-center text-red-600 text-sm py-6"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const form = document.getElementById('trackForm');
    const input = document.getElementById('requestIdInput');
    const result = document.getElementById('result');
    const errorEl = document.getElementById('error');

    // Pre-fill from URL
    const preId = qs('id');
    if (preId) {
      input.value = preId;
      track(preId);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      track(input.value.trim());
    });

    async function track(id) {
      result.classList.add('hidden');
      errorEl.classList.add('hidden');
      if (!id) return;

      const res = await API.getRequestStatus(id);
      if (!res.success) {
        errorEl.textContent = res.error || 'Request not found';
        errorEl.classList.remove('hidden');
        return;
      }

      document.getElementById('displayId').textContent = res.requestId;
      document.getElementById('displayItem').textContent = res.item || '';
      document.getElementById('displayStatus').innerHTML = statusBadge(res.status);

      const timeline = document.getElementById('timeline');
      timeline.innerHTML = (res.timeline || []).map(step => {
        let icon = '○';
        let cls = 'text-slate-400';
        if (step.state === 'done') { icon = '✓'; cls = 'text-emerald-600'; }
        if (step.state === 'current') { icon = '●'; cls = 'text-brand-600 font-medium'; }
        return `<li class="flex items-center gap-3 text-sm ${cls}">
          <span class="w-5 text-center">${icon}</span>
          <span>${step.label}</span>
        </li>`;
      }).join('');

      result.classList.remove('hidden');
    }
  </script>
</body>
</html>
